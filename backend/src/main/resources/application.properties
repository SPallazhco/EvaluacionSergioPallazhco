# Aplicación
quarkus.application.name=transferencias-api

# Base de datos
quarkus.datasource.db-kind=mysql
quarkus.datasource.devservices.image-name=mysql:8.4

# Flyway gestiona el esquema; Hibernate solo valida que las entidades coincidan con él
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
# Las fechas se guardan en UTC; la zona horaria de negocio solo se aplica al calcular "el día"
quarkus.hibernate-orm.jdbc.timezone=UTC

# JSON: rechaza propiedades desconocidas para detectar errores del cliente en lugar de ignorarlos
quarkus.jackson.fail-on-unknown-properties=true

# OpenAPI / Swagger UI (disponible también fuera del modo dev)
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=Transferencias Interbancarias - API
quarkus.smallrye-openapi.info-title=API de Transferencias Interbancarias
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Administración de cuentas bancarias, ejecución de transferencias \
  con validaciones de negocio, detección automática de operaciones sospechosas y consulta del historial. \
  Los errores siguen el formato RFC 7807 (application/problem+json) e incluyen un código estable. \
  Las fechas se expresan en UTC (ISO-8601); el día calendario se determina en America/Guayaquil.
quarkus.smallrye-openapi.info-contact-name=Sergio Pallazhco

# Reglas de negocio de transferencias
transferencias.zona-horaria=America/Guayaquil
transferencias.limite-diario=10000.00
transferencias.sospecha.monto-maximo=5000.00
transferencias.sospecha.maximo-transferencias-en-ventana=5
transferencias.sospecha.ventana=PT1H
